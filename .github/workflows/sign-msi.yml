name: Sign MSI

on:
  workflow_dispatch:
    inputs:
      msi_url:
        description: "MSI download URL"
        required: true
        type: string

jobs:
  sign:
    runs-on: windows-latest

    steps:
      - name: Download MSI
        run: |
          Invoke-WebRequest -Uri "${{ inputs.msi_url }}" -OutFile unsigned.msi

      - name: Restore Certificate
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.CERT_BASE64 }}")
          [IO.File]::WriteAllBytes("cert.pfx", $bytes)

      - name: Verify signtool exists
        run: |
          dir "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe

      - name: Sign MSI (x64 signtool)
        run: |
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe" sign `
            /f cert.pfx `
            /p "${{ secrets.CERT_PASSWORD }}" `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            unsigned.msi

      - name: Upload Signed MSI
        uses: actions/upload-artifact@v4
        with:
          name: signed-msi
          path: unsigned.msi
