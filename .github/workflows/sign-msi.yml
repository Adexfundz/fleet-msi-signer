name: Sign MSI

on:
  workflow_dispatch:
    inputs:
      msi_url:
        description: "MSI download URL"
        required: true
        type: string

jobs:
  sign:
    runs-on: windows-latest

    steps:
      - name: Download MSI
        run: |
          Invoke-WebRequest -Uri "${{ inputs.msi_url }}" -OutFile unsigned.msi

      - name: Restore Certificate
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.CERT_BASE64 }}")
          [IO.File]::WriteAllBytes("cert.pfx", $bytes)

      - name: Locate signtool
        run: |
          $tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Select-Object -First 1
          echo "SIGNTOOL=$($tool.FullName)" >> $env:GITHUB_ENV

      - name: Sign MSI
        run: |
          & "$env:SIGNTOOL" sign `
            /f cert.pfx `
            /p "${{ secrets.CERT_PASSWORD }}" `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            unsigned.msi

      - name: Upload Signed MSI
        uses: actions/upload-artifact@v4
        with:
          name: signed-msi
          path: unsigned.msi
